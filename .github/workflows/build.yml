name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ./*.zip && ls
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Prepare build (separate app id, no ffmpeg)
        working-directory: PortYouStudio
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/; s/isShrinkResources = true/isShrinkResources = false/; /ffmpeg-kit/d; /abiFilters/d' app/build.gradle.kts
          sed -i 's/applicationId = "com.portyou.studio"/applicationId = "com.portyou.studio.two"/' app/build.gradle.kts
          sed -i 's/android:label="PortYou Studio"/android:label="PortYou 2"/' app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/portyou/studio/convert/AudioMerge.kt <<'EOF'
          package com.portyou.studio.convert

          import java.io.File

          object AudioMerge {
              fun merge(inputs: List<File>, out: File): Boolean {
                  out.parentFile?.mkdirs()
                  if (inputs.isEmpty()) return false
                  inputs[0].copyTo(out, overwrite = true)
                  return inputs.size == 1
